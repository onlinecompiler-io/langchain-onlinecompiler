[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-onlinecompiler"
dynamic = ["version"]
description = "LangChain tools for OnlineCompiler.io: let an agent run code, or judge code against test cases, in 46 languages in a sandbox"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RunCode Inc." }]
keywords = ["langchain", "langgraph", "agents", "tools", "code execution", "code interpreter", "sandbox", "online compiler", "online judge", "onlinecompiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "onlinecompiler>=0.9.0,<1.0.0",
]

[project.urls]
Homepage = "https://onlinecompiler.io"
Documentation = "https://github.com/onlinecompiler-io/langchain-onlinecompiler/tree/main/python#readme"
Source = "https://github.com/onlinecompiler-io/langchain-onlinecompiler"
Issues = "https://github.com/onlinecompiler-io/langchain-onlinecompiler/issues"
Changelog = "https://onlinecompiler.io/changelog"

[dependency-groups]
test = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain-tests>=1.1.9,<1.2.0",
    "langchain>=1.0.0,<2.0.0",
]
lint = ["ruff>=0.13.1,<0.16.0"]
typing = ["mypy>=1.18.0,<3.0.0"]

[tool.hatch.version]
path = "langchain_onlinecompiler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_onlinecompiler"]

[tool.hatch.build.targets.sdist]
include = ["langchain_onlinecompiler", "tests", "docs", "README.md", "LICENSE", "Makefile"]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "D", "E", "EM", "F", "FA", "I", "PIE", "PERF", "RET", "RUF", "S", "SIM", "T20", "TID", "UP", "W"]
ignore = [
    "RUF012",  # Doesn't play well with Pydantic
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Tests need assertions
    "D",     # Test names say what they check
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
